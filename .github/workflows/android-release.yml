name: Sign KPN Android release
on:
  workflow_dispatch:
    inputs:
      highest_published_version_code:
        description: Highest version code already distributed
        required: true
        type: string
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      KPN_KEYSTORE_FILE: ${{ runner.temp }}/kpn-release.jks
      KPN_KEYSTORE_PASSWORD: ${{ secrets.KPN_KEYSTORE_PASSWORD }}
      KPN_KEY_PASSWORD: ${{ secrets.KPN_KEY_PASSWORD }}
      KPN_KEY_ALIAS: ${{ secrets.KPN_KEY_ALIAS }}
      KPN_HIGHEST_RELEASE_CODE: ${{ inputs.highest_published_version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Load existing release key privately
        env:
          KEY_B64: ${{ secrets.KPN_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          value=os.environ.get('KEY_B64','')
          if not value: raise SystemExit('Configure the private release signing secrets first.')
          p=Path(os.environ['KPN_KEYSTORE_FILE'])
          p.write_bytes(base64.b64decode(value,validate=True));p.chmod(0o600)
          PY
      - run: bash scripts/build-android.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: kpn-signed-release-apk
          path: Kpn_android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove private signing material
        if: always()
        run: rm -f "$KPN_KEYSTORE_FILE"
