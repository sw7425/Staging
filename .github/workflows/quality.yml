name: KPN quality checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kpn_ci
          POSTGRES_USER: kpn_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U kpn_ci'
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KPN_ENV: test
      DEBUG: 'False'
      DATABASE_URL: postgresql://kpn_ci:synthetic-ci-only@localhost:5432/kpn_ci
      SESSION_SECRET: isolated-ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r requirements.lock.txt
      - run: bash scripts/test-backend.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: Kpn_android
        run: bash gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
