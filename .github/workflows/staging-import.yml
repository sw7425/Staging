name: One-time verified staging source import
on:
  push:
    branches: [staging-import]
    paths: ['.staging-import/READY.json']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-import
      - name: Restore exact sanitized source bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, shutil, zipfile
          root=Path.cwd()
          spec=json.loads((root/'.staging-import/READY.json').read_text())
          encoded=''.join((root/f'.staging-import/archive-{i:03}.b64').read_text() for i in range(spec['chunks']))
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()==spec['sha256'], 'Archive digest mismatch'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              names=archive.namelist()
              assert len(names)==len(set(names)) and set(names)==set(spec['files']), 'Archive inventory mismatch'
              for name in names:
                  rel=PurePosixPath(name)
                  assert not rel.is_absolute() and '..' not in rel.parts and not name.startswith(('.git/','.github/','.staging-import/')), 'Unsafe path'
                  data=archive.read(name)
                  assert hashlib.sha256(data).hexdigest()==spec['files'][name], 'File digest mismatch'
                  target=root/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          shutil.rmtree(root/'.staging-import')
          print(f'Verified and restored {len(names)} exact source files; transfer payload removed.')
          PY
      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore verified sanitized KPN source and binary assets'
          git push origin HEAD:staging-import
